[build-system]
requires      = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "agent-starter-python"
version         = "1.0.0"
description     = "Simple voice AI assistant built with LiveKit Agents for Python"
requires-python = ">=3.9"

dependencies = [
    "aiohttp>=3.12,<4",
    "livekit-agents[cartesia,deepgram,elevenlabs,google,openai,silero,turn-detector]~=1.2",
    "faster-whisper>=1.2",
    "piper-tts>=1.8",
    "python-dotenv",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode                       = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length    = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]                                                      # Line too long (handled by formatter)

[tool.ruff.format]
quote-style  = "double"
indent-style = "space"

[tool.pylance]
venvPath = "."
venv     = ".venv"
